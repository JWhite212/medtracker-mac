name: CI

# Phase 1a gate: both local Swift packages must `swift test` green and the
# whole `Packages/` tree must pass `swiftformat --lint`. Runs on every PR and
# on pushes to `main` (post-merge). See docs/plans/2026-07-26-phase-1a-domain-core.md
# Task 15.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: swift test (core + data) + format lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # GRDB.swift is the only external dependency; cache the resolved
      # SwiftPM checkout + each package's build products, keyed on the
      # manifests so a dependency bump busts the cache.
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Packages/MedTrackerCore/.build
            Packages/MedTrackerData/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Test MedTrackerCore
        working-directory: Packages/MedTrackerCore
        run: swift test

      - name: Test MedTrackerData
        working-directory: Packages/MedTrackerData
        run: swift test

      - name: Install SwiftFormat
        run: brew install swiftformat

      # Lints the same tree the local `.swiftformat` config targets; the
      # config's --disable list keeps parity-sensitive TS-ported source
      # untouched. Fails the job on any formatting drift.
      - name: Lint (SwiftFormat)
        run: swiftformat --lint Packages

      - name: Install SwiftLint
        run: brew install swiftlint

      # Strict lint scoped to the two packages' Sources+Tests via the repo-root
      # `.swiftlint.yml`'s `included:` list. That config disables only the rules
      # that clash with the parity-ported style / SwiftFormat, so any NEW
      # violation (zero today) fails the job.
      - name: Lint (SwiftLint)
        run: swiftlint --strict
